<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head >
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background-image:url('https://e2c.cg/wp-content/uploads/2025/04/E2C-Cover1.jpg');background-size: cover;
            background-position: center;" id="login-page">

  <div class="card p-4" style="width: 360px;" img src="">
    <img src="./assets/logo.PNG" alt="E2C" class="h-10 mb-3">
    <h4 class="mb-3">Connexion Admin</h4>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{category}}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-2">
            <label class="form-label">Nom d'utilisateur</label>
            <input name="username" class="form-control" autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input name="password" type="password" class="form-control">
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <button class="btn btn-primary" type="submit">Se connecter</button>
            <a href="/" class="text-muted">Retour</a>
        </div>
    </form>

    <div class="mt-3 text-muted small">Connexion requise pour accéder au Dashboard</div>
</div>
</body>
</html>
