<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0px 0;
        }
        .navbar {
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .navbar-brand {
            font-weight: bold;
            color: white !important;
            font-size: 1.5rem;
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
        }
        .nav-link:hover {
            color: white !important;
        }
        .container-main {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .card-item {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 20px;
        }
        .card-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .card-item .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0 !important;
        }
        .card-item .card-title {
            color: #667eea;
            font-weight: bold;
            margin: 0;
        }
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #667eea;
            margin-right: 8px;
        }
        .item-user {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">
                <i class="bi bi-house"></i> Accueil
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/dashboard/users">
                <i class="bi bi-people"></i> Utilisateurs
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/dashboard/items">
                <i class="bi bi-list-check"></i> Items
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/dashboard/analytics">
                <i class="bi bi-graph-up"></i> Statistiques
              </a>
            </li>
            <li class="nav-item">
                    <a class="nav-link" href="/dashboard/db">
                   <i class="fa-solid fa-database"></i>Base de données
                   </a>
             </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid px-4">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 style="color: #667eea;">
                    <i class="bi bi-list-check"></i> Gestion des Items
                </h2>
                <button class="btn btn-primary" onclick="location.reload()">
                    <i class="bi bi-arrow-clockwise"></i> Rafraîchir
                </button>
            </div>

            <div class="item-grid" id="itemsContainer">
                <div class="text-center text-muted w-100 py-5">
                    <i class="bi bi-hourglass-split" style="font-size: 2rem;"></i>
                    <p class="mt-3">Chargement des items...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-4 m-0 t-4">
      <div class="container">
        <p class="mb-0">
          &copy; 2025 Dashboard E²C congo. Tous droits réservés.
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();

        function updateItemsGrid(items) {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = '<div class="text-center text-muted w-100 py-5"><i class="bi bi-inbox" style="font-size: 2rem;"></i><p class="mt-3">Aucun item trouvé</p></div>';
                return;
            }
            items.forEach(item => {
                const avatar = item.user_photo ? `<img src="${item.user_photo}" alt="${item.username}" class="user-avatar">` : '<svg class="user-avatar" viewBox="0 0 40 40"><rect width="40" height="40" fill="#667eea"/><text x="20" y="20" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="white" font-weight="bold">' + item.username.charAt(0).toUpperCase() + '</text></svg>';
                const card = `
                    <div class="card card-item">
                        <div class="card-header">
                            <h5 class="card-title">${item.title} <small class="text-muted">(${item.source})</small></h5>
                        </div>
                        <div class="card-body">
                            <p class="card-text">${item.description || 'Pas de description'}</p>
                            <div class="item-user">
                                ${avatar}
                                <span><strong>${item.username}</strong></span>
                            </div>
                            <div class="text-muted small">
                                <i class="bi bi-calendar"></i> ${item.created_at ? new Date(item.created_at).toLocaleString('fr-FR') : 'N/A'}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        socket.on('dashboard_update', function(data) {
            updateItemsGrid(data.items);
            console.log('Items grid updated:', data.items.length, 'items');
        });

        // recharge initiale des items
        socket.on('connect', function() {
            console.log('Connected to dashboard');
        });
    </script>
</body>
</html>
